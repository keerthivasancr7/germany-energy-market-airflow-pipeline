name: Inspect deployment identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: aws-deploy
    permissions:
      id-token: write
    steps:
      - name: Print identity claims only; never print the token or call AWS
        shell: python
        run: |
          import base64
          import json
          import os
          import urllib.request

          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          print(json.dumps({key: claims[key] for key in [
              'iss', 'aud', 'sub', 'repository_id', 'repository_owner_id', 'ref'
          ]}, indent=2))
