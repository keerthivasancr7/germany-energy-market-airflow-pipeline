name: Deploy tested Glue script

on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'include/sql/**'
      - 'include/tests/**'
      - 'tools/**'
      - 'requirements-*.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-script-deployment
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_source.py
      - run: python -m unittest discover -s include/tests -v

  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-22.04
    environment: aws-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: energy-script-deploy
      - run: python -m pip install -r requirements-dev.txt
      - name: Upload and verify script; do not run the Glue job
        env:
          ENERGY_BUCKET: ${{ vars.ENERGY_BUCKET }}
        run: python tools/deploy_glue_script.py --bucket "$ENERGY_BUCKET" --commit "$GITHUB_SHA"
